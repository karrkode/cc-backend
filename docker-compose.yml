# Local development: Postgres + the API.
#   docker compose up --build                       API on http://localhost:8000 (docs at /docs)
#   docker compose --profile web up --build         also serve the cc-site page on http://localhost:4173
#   docker compose run --rm api python -m scripts.seed
#   docker compose run --rm api python -m scripts.sync_sheet [--dry-run]
#   docker compose run --rm api python -m scripts.make_admin you@example.com

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: culture
      POSTGRES_PASSWORD: culture
      POSTGRES_DB: culture
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culture -d culture"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      ENV: local
      DATABASE_URL: postgresql+psycopg://culture:culture@db:5432/culture
      JWT_SECRET: local-dev-secret-not-for-production
      CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    # The frontend (the cc-site repo), served the way S3 + CloudFront will serve it.
    # Off unless asked for with --profile web. FRONTEND_DIR defaults to a cc-site checkout beside this repo.
    profiles: ["web"]
    image: nginx:1.27-alpine
    ports:
      - "4173:80"
    volumes:
      - ${FRONTEND_DIR:-../cc-site/public}:/usr/share/nginx/html:ro

volumes:
  pgdata:
