# The local site server (docker compose --profile web), set up the way S3 + CloudFront serve the site.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CC-121: production uploads a copy of index.html as the object "join" (with the join page's preview
    # tags); here the page itself stands in for it.
    location = /join { try_files /join /index.html; }
    # CC-126: likewise the invite page (/invite), the join page with the admins' invite pitch.
    location = /invite { try_files /invite /index.html; }

    # CC-109: the paths CloudFront sends to the API (infra/aws/frontend.tf): event pages, roundups, sitemap, robots.txt
    # (looked up per request through Docker's DNS, so nginx starts even before the API does)
    location ~ ^/(e/|chicago(/|$)|sitemap\.xml$|robots\.txt$) {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api;
    }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
