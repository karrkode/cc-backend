# The local site server (docker compose --profile web), set up the way S3 + CloudFront serve the site.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CC-193: the Content-Security-Policy, enforced here so a violation shows up at once. Production sends it as
    # Report-Only first (infra/aws/frontend.tf, where the same lists live; tests/test_csp.py keeps them equal).
    # The only difference: img-src and connect-src also allow the local API, which the site reaches on another port.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-fKtflTlilgoEdPhIIhjI+ISyYPQ2B0LkNrNMqwKPy3U='; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' https://api.chiculturecrew.com https://api.github.com http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CC-121: production uploads a copy of index.html as the object "join" (with the join page's preview
    # tags); here the page itself stands in for it.
    location = /join { try_files /join /index.html; }
    # CC-126: likewise the invite page (/invite), the join page with the admins' invite pitch.
    location = /invite { try_files /invite /index.html; }

    # CC-109: the paths CloudFront sends to the API (infra/aws/frontend.tf): event pages, roundups, sitemap, robots.txt
    # (looked up per request through Docker's DNS, so nginx starts even before the API does)
    location ~ ^/(e/|chicago(/|$)|sitemap\.xml$|robots\.txt$) {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api;
        # add_header in a location replaces the server-level ones, so the pages the API renders carry their own policy
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-fKtflTlilgoEdPhIIhjI+ISyYPQ2B0LkNrNMqwKPy3U='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # CC-250: event photos, which CloudFront serves from their own bucket; locally the folder app/event_images.py writes
    location /event-images/ { root /usr/share/nginx/photos; try_files $uri =404; }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
