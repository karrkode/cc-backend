# Weekly pull requests for outdated dependencies; each one runs through CI before merging.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/infra/aws/server/caddy"] # the API image's base, and the server's Caddy pin (CC-183)
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/aws
    schedule: { interval: monthly }
